services:
  attendance:
    build: .
    image: smart-attendance-system:local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - attendance-data:/app/instance
      - ./models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  attendance-data: